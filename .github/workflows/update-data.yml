name: Update Player Data

# Rebuilds public/data/players.json from the FIFA Fantasy feeds via build_pool.cjs.
permissions:
  contents: write

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:

jobs:
  refresh-players:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild player pool
        run: node r-analytics/build_pool.cjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/players.json
          if git diff --staged --quiet; then
            echo "No player-pool changes."
          else
            git commit -m "data: refresh player pool"
            git pull --rebase --autostash origin main   # handle 'fetch first' rejection from concurrent runs
            git push
          fi
