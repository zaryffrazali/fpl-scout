name: Update News

# Fetches WC2026 fantasy news via apifootball_news.cjs (API-Football / api-sports.io, free tier).
# Runs every 6h but ONLY actually fetches during the tournament window (Jun 2 – Jul 19);
# outside that window the fetch step is skipped (kept tight to the live period).
# Requires GitHub secret: API_FOOTBALL_KEY (free from dashboard.api-football.com).
# Fallback: r-analytics/news_fetch.cjs (Claude + web search) — not run by default.
permissions:
  contents: write

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check if matchday period
        id: check_date
        run: |
          TODAY=$(date -u +%Y%m%d)   # numeric YYYYMMDD — unambiguous integer comparison
          if [ "$TODAY" -gt 20260601 ] && [ "$TODAY" -lt 20260720 ]; then
            IS_TOURNAMENT=true
          else
            IS_TOURNAMENT=false
          fi
          echo "is_tournament=$IS_TOURNAMENT" >> $GITHUB_OUTPUT
          echo "Today is $TODAY, is_tournament=$IS_TOURNAMENT"
      - name: Fetch news (API-Football)
        if: steps.check_date.outputs.is_tournament == 'true'
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: npm run fetch-apifootball-news
      - name: Commit if changed
        if: steps.check_date.outputs.is_tournament == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "No news changes."
          else
            git commit -m "data: refresh news"
            git pull --rebase --autostash origin main   # handle 'fetch first' rejection from concurrent runs
            git push
          fi
